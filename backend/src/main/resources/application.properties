spring.application.name=payroll-attendance-backend
server.port=8080

# ============================================================
# PostgreSQL Datasource Configuration
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/payroll_attendance}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:AKSHAIRAM@2007}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# HikariCP Connection Pool
# ============================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# ============================================================
# Spring Data JPA / Hibernate Configuration
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true

# ============================================================
# JWT Security Configuration
# ============================================================
jwt.secret=${JWT_SECRET:WorkPulseSecureJwtSecretKeyForPayrollAttendanceSystem2026!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ============================================================
# Google OAuth 2.0 Configuration
# ============================================================
google.oauth.client-id=${GOOGLE_CLIENT_ID:857844766578-p6p5m390fcm2jjjkorirebub1fq6jb96.apps.googleusercontent.com}
google.oauth.verify-token=true
spring.security.oauth2.client.registration.google.client-id=857844766578-p6p5m390fcm2jjjkorirebub1fq6jb96.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRE

spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ============================================================
# Multipart / File Upload Configuration
# ============================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
